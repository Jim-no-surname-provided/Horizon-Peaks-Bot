#   %member.id%
#   %guild.name%
#   %guild.id%
#   %channel.name%
#   %channel.mention%
#   %channel.id%
#   %command.name%
#
# Config:
#   %branding.name%
#   %branding.banner%
#   %servers.network%
#   %servers.smp%
#   %servers.creative%
#   %links.website%
#   %links.map%
#   %links.vote%
#   %colors.brand%
#   %colors.success%
