- name: suggestion
  description: Submit a community suggestion
  modalId: modal:suggestion:create

- name: suggestion-info
  permissions:
    - administrator
  description: Post information about the suggestion system
  embeds:
    - title: "📋 Community Suggestions"
      color: "%colors.brand%"
      description: |
        Have an idea to improve the server?
        Submit a suggestion and let the community vote on it!

        ## How to Submit

        Use the `/suggestion` command in this channel.
        You'll see the rules, then fill out a short form with your idea.

        ## Voting

        ✅ - Upvote a suggestion you support
        ⛔ - Downvote a suggestion you disagree with

        You can only vote one way per suggestion.
        Changing your vote automatically removes the previous one.

        ## How Suggestions Are Resolved

        - Each suggestion is open for **%suggestions.initialDays% days**.
        - A minimum of **%suggestions.minimumVotes% votes** is required.
        - If there aren't enough votes, the suggestion is extended by **%suggestions.extensionDays% days**.
        - After the extension, suggestions with insufficient votes are **denied**.
        - If enough votes are cast, the majority decides: more ✅ = approved, more ⛔ = denied.

        ## Rules

        - You can have a maximum of **%suggestions.maxActivePerUser% active suggestions** at a time.
        - Admins can approve or reject any suggestion at any time.
        - You may resubmit a denied suggestion, but **do not spam**.
        - Use the thread under each suggestion for discussion.
      footer: "%branding.name%"
  action: suggestions.Info

- name: suggestion-approve
  permissions:
  - administrator
  description: Manually reject a suggestion from the discussion thread
  action: suggestions.Approve

- name: suggestion-reject
  permissions:
  - administrator
  description: Manually reject a suggestion from the discussion thread
  action: suggestions.Reject

- name: suggestion-repurpose
  permissions:
  - administrator
  description: Reopen a resolved suggestion from the discussion thread
  action: suggestions.Reopen
