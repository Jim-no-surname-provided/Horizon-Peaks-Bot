# Horizon Peaks slash commands
#
# COMMAND DEFINITIONS
#
# Each top-level list entry defines one Discord slash command.
#
# Required properties:
#
#   name
#     The slash command name.
#
#   description
#     The description shown by Discord when selecting the command.
#
# Optional properties:
#
#   permissions
#     Restricts who Discord allows to use the command.
#     If omitted, everyone can use the command.
#
#     Example:
#
#       permissions:
#         - administrator
#
#   arguments
#     Defines slash command arguments.
#
#     Each argument supports:
#       name
#       description
#       required
#
#     Command arguments are also available as placeholders using their name.
#
#     Example:
#
#       arguments:
#         - name: name
#           description: Name of the announcement to post
#           required: true
#
#   embeds
#     One or more Discord embeds rendered when the command is called.
#
#     Embeds may contain:
#       title
#       url
#       description
#       color
#       thumbnail
#       image
#       footer
#       fields
#
#     Fields contain:
#       name
#       value
#       inline
#
#   action
#     Runs custom Java behavior for commands that cannot be represented
#     entirely through YAML.
#
#     Action names are relative to the bot's actions package.
#
#     Examples:
#
#       action: Ping
#       action: suggestions.Approve
#
#     A command may contain both declarative content and an action when the
#     action needs to extend or modify that content.
#
#   modalId
#     Opens a modal defined in definitions/modals.yaml.
#
#     The value must match the modal's configured ID.
#
#     Example:
#
#       modalId: modal:suggestion:create
#
#     Use this when the command only needs to open a configured form instead
#     of implementing that behavior in a Java action.
#
#
# PLACEHOLDERS
#
# Event:
#   %member.name%
#   %member.displayName%
#   %member.mention%
#   %member.id%
#   %guild.name%
#   %guild.id%
#   %channel.name%
#   %channel.mention%
#   %channel.id%
#   %command.name%
#
# Config:
#   %branding.name%
#   %branding.banner%
#   %servers.network%
#   %servers.smp%
#   %servers.creative%
#   %links.website%
#   %links.map%
#   %links.vote%
#   %colors.brand%
#   %colors.success%
#   %colors.error%
#   %colors.vip%
#   %colors.booster%
#   %images.vip%
#   %images.booster%
#   %channels.welcome%
#   %channels.communityInfo%
#   %channels.activeSuggestions%
#   %channels.approvedSuggestions%
#   %channels.deniedSuggestions%
#   %suggestions.initialDays%
#   %suggestions.minimumVotes%
#   %suggestions.extensionDays%
#   %suggestions.maxActivePerUser%
#
# Command arguments are available as placeholders using their argument name.

